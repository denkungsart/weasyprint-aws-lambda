name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate release metadata and shell scripts
        run: |
          bash -n scripts/image-tag.sh test/smoke.sh
          scripts/image-tag.sh Dockerfile

      - name: Build ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: weasyprint-aws-lambda:test
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils qpdf

      - name: Run smoke test
        env:
          EXPECTED_ARCHITECTURE: arm64
        run: test/smoke.sh weasyprint-aws-lambda:test
